<script>
const DB_NAME='MyPharmacyDB', DB_VER=11;
let db, state={view:'dashboard',products:[],cart:[],sales:[],returns:[],purchases:[],expenses:[],customers:[],pharmacists:[],shifts:[],users:[],currentUser:null,settings:{name:'MyPharmacy',phone:'',address:'',currency:'ج.س'},query:'',saleFilter:'',saleFrom:'',saleTo:'',purchaseFilter:'',purchaseFrom:'',purchaseTo:'',expenseFrom:'',expenseTo:'',reportFrom:'',reportTo:'',discountType:'percent',discountValue:0,paymentMethod:'cash',paymentProof:'',dashboardPeriod:'today'};
const $=id=>document.getElementById(id);
function money(n){return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+state.settings.currency}
function paymentMethodLabel(m){return m==='bankak'?'بنكك':m==='fawry'?'فوري':m==='ocash'?'أوكاش':'كاش'}
function isElectronicPayment(m){return ['bankak','fawry','ocash'].includes(m)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
const COLS=['products','sales','purchases','expenses','customers','settings','pharmacists','shifts','users','returns'];
const FB=window.FIREBASE_CONFIG,BOOT_EMAIL='manager@mypharmacy.app';
let fbAuth,fdb,cache={},unsubs=[],rfT=null;
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const docKey=(s,o)=>String(s==='users'&&o.uid?o.uid:o.id);
const cloudErr=e=>{console.error(e);toast('تعذر الحفظ في السحابة: '+(e.code==='permission-denied'?'لا تملك صلاحية':'تحقق من الاتصال'))};
function startCloud(){return Promise.all(COLS.map(n=>new Promise((res,rej)=>{let first=true;cache[n]=new Map();
  unsubs.push(fdb.collection(n).onSnapshot(s=>{s.docChanges().forEach(c=>{if(c.type==='removed')cache[n].delete(c.doc.id);else cache[n].set(c.doc.id,c.doc.data())});
    if(first){first=false;res()}else if(!s.metadata.hasPendingWrites)scheduleRefresh()},
    e=>{if(first){first=false;rej(e)}else if(e.code==='permission-denied'){logout();toast('تم إيقاف حسابك أو تغيير كلمة السر')}else console.error(e)}))})))}
function stopCloud(){unsubs.forEach(f=>f());unsubs=[];cache={};clearTimeout(rfT)}
function scheduleRefresh(){clearTimeout(rfT);rfT=setTimeout(async function tryR(){const a=document.activeElement;if(!state.currentUser)return;if((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||$('modal').classList.contains('show')){rfT=setTimeout(tryR,4000);return}await load();render()},800)}
function openDB(){return Promise.resolve()}
function all(s){return Promise.resolve([...(cache[s]||new Map()).values()].map(clone).sort((a,b)=>(a.id>b.id)-(a.id<b.id)))}
function put(s,o){if(o.id==null)o.id=newId();const d=clone(o),k=docKey(s,d);cache[s].set(k,d);fdb.collection(s).doc(k).set(d).catch(cloudErr);return Promise.resolve(d.id)}
function add(s,o){o.id=newId();return put(s,o)}
function del(s,id){const f=[...cache[s].entries()].find(([k,v])=>v.id===id),k=f?f[0]:String(id);cache[s].delete(k);fdb.collection(s).doc(k).delete().catch(cloudErr);return Promise.resolve()}
async function enterApp(){await startCloud();await seed();await migrateUnits();await load();restoreSession()}
async function bootCloud(){
  if(!FB||!FB.apiKey||/PASTE|YOUR/i.test(FB.apiKey)){$('app').innerHTML='<div style="padding:24px;font-family:Arial;direction:rtl;text-align:center"><h2>إعداد Firebase ناقص</h2><p>افتح الملف <b>public/firebase-config.js</b> والصق إعدادات مشروعك فيه ثم أعد النشر.</p></div>';return}
  firebase.initializeApp(FB);fbAuth=firebase.auth();fdb=firebase.firestore();
  try{await fdb.enablePersistence({synchronizeTabs:true})}catch(_){}
  const u=await new Promise(r=>{const off=fbAuth.onAuthStateChanged(x=>{off();r(x)})});
  if(u){try{await enterApp()}catch(e){console.error(e)}if(!state.currentUser){try{await fbAuth.signOut()}catch(_){}stopCloud()}}
  render()}
function authMsg(e){const c=e&&e.code||'';return c==='auth/weak-password'?'كلمة السر يجب أن تكون 6 أحرف على الأقل':c==='auth/network-request-failed'?'تعذر الاتصال بالإنترنت':c==='auth/too-many-requests'?'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة':c==='auth/requires-recent-login'?'سجّل الخروج ثم الدخول من جديد وأعد المحاولة':c==='app/inactive'?'الحساب غير مفعّل أو غير موجود':'اسم المستخدم أو كلمة السر غير صحيحة'}
async function createAuthUser(email,password){const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB,'sec'),a=sec.auth(),c=await a.createUserWithEmailAndPassword(email,password);await a.signOut();return c.user.uid}
const genEmail=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'@mypharmacy.app';
const loginRef=n=>fdb.collection('logins').doc(encodeURIComponent(n));
async function ensureBootProfile(){const u=fbAuth.currentUser;if(!u||u.email!==BOOT_EMAIL)return;const ref=fdb.collection('users').doc(u.uid);if((await ref.get()).exists)return;await ref.set({id:newId(),uid:u.uid,username:'manager',role:'manager',pharmacistId:null,createdAt:new Date().toISOString(),active:true,authEmail:BOOT_EMAIL});await loginRef('manager').set({email:BOOT_EMAIL})}
async function seed(){if((await all('products')).length)return;let p=[
{name:'Paracetamol 500mg',scientific:'Paracetamol',category:'Analgesics & Antipyretics',price:150,cost:90,stock:45,minStock:10,expiry:'2027-12-31',boxStrips:2,stripUnits:10,stripPrice:75,piecePrice:7.5,shelf:'A-01'},
{name:'Amoxicillin 500mg',scientific:'Amoxicillin',category:'Penicillins & Cephalosporins',price:450,cost:300,stock:20,minStock:8,expiry:'2027-06-30',boxStrips:2,stripUnits:10,stripPrice:225,piecePrice:22.5,shelf:'A-02'},
{name:'Omeprazole 20mg',scientific:'Omeprazole',category:'Antacids & Anti-ulcer',price:320,cost:200,stock:15,minStock:5,expiry:'2028-01-31',boxStrips:2,stripUnits:10,stripPrice:160,piecePrice:16,shelf:'B-01'},
{name:'Ibuprofen 400mg',scientific:'Ibuprofen',category:'NSAIDS',price:200,cost:120,stock:30,minStock:8,expiry:'2027-09-30',boxStrips:2,stripUnits:10,stripPrice:100,piecePrice:10,shelf:'A-03'},
{name:'Ciprofloxacin 500mg',scientific:'Ciprofloxacin',category:'Macrolides & Quinolones',price:600,cost:390,stock:12,minStock:5,expiry:'2027-05-31',boxStrips:2,stripUnits:10,stripPrice:300,piecePrice:30,shelf:'B-02'}];for(const x of p){x.boxSaleEnabled=false;await add('products',x)}}
function normalizeDosageForm(form){
  const f=String(form||'').trim().toLowerCase();
  const map={
    'tablets':'tablets_capsules','capsules':'tablets_capsules','tablet':'tablets_capsules','capsule':'tablets_capsules',
    'suspension':'liquid','solution':'liquid','syrup':'liquid','liquid':'liquid',
    'cream':'topical','ointment':'topical','topical':'topical',
    'drops':'drops','drop':'drops',
    'injection':'injections','injections':'injections',
    'canula':'other','cannula':'other',
    'inhalation':'inhalations_aerosols','inhalations':'inhalations_aerosols','aerosol':'inhalations_aerosols',
    'suppository':'suppositories_pessaries','pessary':'suppositories_pessaries',
    'transdermal':'transdermal_patches','patch':'transdermal_patches','transdermal patch':'transdermal_patches',
    'effervescent':'effervescent','effervescent formulations':'effervescent',
    'powder':'powders_granules','granules':'powders_granules','powders':'powders_granules',
    'implant':'implants_inserts','inserts':'implants_inserts',
    'nasal spray':'nasal_sprays','spray':'nasal_sprays','nasal_sprays':'nasal_sprays',
    'other':'other'
  };
  if(!f)return 'tablets_capsules';
  return map[f]||map[String(form||'').trim()]||'other';
}
async function migrateUnits(){
  let ps=await all('products');
  for(const p of ps){
    let changed=false;
    const normalized=normalizeDosageForm(p.dosageForm);
    if(p.dosageForm!==normalized){p.dosageForm=normalized;changed=true}
    const strip=isStripForm(p);
    const legacyBoxStrips=Math.max(1,Number(p.boxStrips||1));
    const legacyStripUnits=Math.max(1,Number(p.stripUnits||1));
    if(p.cost==null){p.cost=0;changed=true}
    if(p.shelf==null){p.shelf='';changed=true}
    if(p.warehouseUnits==null){p.warehouseUnits=0;changed=true}
    if(p.unitAccountingVersion!==2){
      if(strip){
        // v48 stored tablets/capsules as individual pieces. Convert once to strips.
        const oldPieces=Number(p.stockUnits!=null?p.stockUnits:(Number(p.stock||0)*legacyBoxStrips*legacyStripUnits));
        p.stockUnits=Math.max(0,Math.floor(oldPieces/legacyStripUnits));
        p.stock=p.stockUnits;
        p.minStock=Math.max(0,Math.ceil(Number(p.minStock||0)*legacyBoxStrips));
        const oldStripPrice=Number(p.stripPrice!=null?p.stripPrice:(Number(p.price||0)/legacyBoxStrips));
        p.price=oldStripPrice;
        p.stripPrice=oldStripPrice;
        // Purchase cost is now per strip.
        p.cost=Number(p.cost||0)/legacyBoxStrips;
      }else{
        p.stockUnits=Math.max(0,Number(p.stockUnits!=null?p.stockUnits:p.stock||0));
        p.stock=p.stockUnits;
      }
      p.unitAccountingVersion=2;
      changed=true;
    }
    if(p.boxSaleEnabled!==false){p.boxSaleEnabled=false;changed=true}
    if(changed) await put('products',p);
  }
  // Convert historical sales/purchases once so old box/pill records remain consistent with strip/unit accounting.
  const sales=await all('sales');
  for(const s of sales){
    if(s.unitAccountingVersion===2) continue;
    let changed=false;
    for(const i of (s.items||[])){
      const p=ps.find(x=>Number(x.id)===Number(i.id));
      if(isStripForm(p||{})){
        if(i.unit==='box'){i.qty=Number(i.qty||0)*Math.max(1,Number(p.boxStrips||1));i.unit='strip';i.unitLabel='شريط';i.unitSize=1;changed=true}
        else if(i.unit==='strip' || i.unit==='unit'){i.qty=Number(i.qty||0)*(i.unit==='unit'?1/Math.max(1,Number(p.stripUnits||1)):1);i.unit='strip';i.unitLabel='شريط';i.unitSize=1;changed=true}
      }else if(i.unitSize!==1){i.unitSize=1;changed=true}
    }
    if(changed||s.unitAccountingVersion!==2){s.unitAccountingVersion=2;await put('sales',s)}
  }
  const purchases=await all('purchases');
  for(const x of purchases){
    if(x.unitAccountingVersion===2) continue;
    const p=ps.find(z=>Number(z.id)===Number(x.productId));
    if(isStripForm(p||{}) && x.unitType==='box'){
      const bs=Math.max(1,Number(p.boxStrips||1));
      x.qty=Number(x.qty||0)*bs;
      x.costPerUnit=Number(x.costPerUnit!=null?x.costPerUnit:x.costPerBox||0)/bs;
      x.unitType='strip';x.unitLabel='شريط';
    }else if(isStripForm(p||{})){
      x.unitType='strip';x.unitLabel='شريط';
      if(x.costPerUnit==null)x.costPerUnit=Number(x.costPerBox||0);
    }else{x.unitType='unit';x.unitLabel='وحدة';if(x.costPerUnit==null)x.costPerUnit=Number(x.costPerBox||0)}
    x.unitAccountingVersion=2;
    await put('purchases',x);
  }
}
async function load(){state.products=await all('products');state.sales=await all('sales');state.returns=await all('returns');state.purchases=await all('purchases');state.expenses=await all('expenses');state.customers=await all('customers');state.pharmacists=await all('pharmacists');state.shifts=await all('shifts');state.users=await all('users');const s=await all('settings');if(s[0])state.settings={...state.settings,...s[0]};if(state.currentUser){const fresh=state.users.find(u=>u.id===state.currentUser.id);if(fresh)state.currentUser=fresh;}}
async function hashPassword(password){
  const text=String(password||'');
  try{
    if(window.crypto?.subtle){
      const data=new TextEncoder().encode(text),buf=await crypto.subtle.digest('SHA-256',data);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return btoa(unescape(encodeURIComponent(text)));
}
function roleLabel(role){return role==='manager'?'Manager — صلاحيات كاملة':role==='supervisor'?'Manager محدود':'صيدلي';}
function isManager(){return state.currentUser?.role==='manager';}
function isSupervisor(){return state.currentUser?.role==='manager'||state.currentUser?.role==='supervisor';}
function can(action){
  if(!state.currentUser)return false;
  if(state.currentUser.role==='manager')return true;
  if(state.currentUser.role==='supervisor')return ['view','sale','inventoryEdit','purchase','expense','customer','shiftOwn','reports'].includes(action);

function cashbox(){
  const sales=state.sales||[], purchases=state.purchases||[], expenses=state.expenses||[];
  let cash=0, bankak=0, fawry=0, ocash=0;
  sales.forEach(s=>{
    const total=Number(s.total||0), paid=Number(s.paidAmount!=null?s.paidAmount:total);
    const change=Number(s.changeAmount||Math.max(0,paid-total));
    if(s.paymentMethod==='bankak') bankak+=paid;
    else if(s.paymentMethod==='fawry') fawry+=paid;
    else if(s.paymentMethod==='ocash') ocash+=paid;
    else cash+=Math.max(0,paid-change);
    if(change>0) cash-=change;
  });
  const applyOut=(method,amount)=>{
    amount=Number(amount||0);
    if(method==='bankak')bankak-=amount;
    else if(method==='fawry')fawry-=amount;
    else if(method==='ocash')ocash-=amount;
    else cash-=amount;
  };
  purchases.forEach(x=>{if(x.deductFromCashbox)applyOut(x.cashboxMethod,x.total)});
  expenses.forEach(x=>{if(x.deductFromCashbox)applyOut(x.cashboxMethod,x.amount)});
  (state.returns||[]).forEach(r=>applyOut(r.refundMethod||'cash',r.refundAmount));
  const total=cash+bankak+fawry+ocash;
  return shell(`<div class="panel"><h2>💰 الصندوق</h2><p class="muted">الرصيد محسوب من المبيعات والمشتريات والمصروفات المسجلة على الصندوق. المبلغ المدفوع إلكترونياً يضاف إلى حساب وسيلة الدفع المحددة.</p></div><div class="grid cards"><div class="card stat">💰 إجمالي الصندوق<b>${money(total)}</b><div class="muted">كاش + بنكك + فوري + أوكاش</div></div><div class="card stat">💵 كاش<b>${money(cash)}</b><div class="muted">السيولة النقدية</div></div><div class="card stat">📱 بنكك<b>${money(bankak)}</b><div class="muted">الرصيد الإلكتروني</div></div><div class="card stat">📲 فوري<b>${money(fawry)}</b><div class="muted">الرصيد الإلكتروني</div></div><div class="card stat">💳 أوكاش<b>${money(ocash)}</b><div class="muted">الرصيد الإلكتروني</div></div></div><div class="panel" style="margin-top:14px"><h2>كيفية احتساب الصندوق</h2><div class="muted" style="line-height:1.9">• الكاش: المدفوعات النقدية ناقص الباقي والمشتريات/المصروفات النقدية.<br>• بنكك: مبيعات بنكك ناقص العمليات المسددة من رصيد بنكك.<br>• فوري: مبيعات فوري ناقص العمليات المسددة من رصيد فوري.<br>• أوكاش: مبيعات أوكاش ناقص العمليات المسددة من رصيد أوكاش.<br>• إجمالي الصندوق = الكاش + بنكك + فوري + أوكاش.</div></div>`,'الصندوق');
}
function warehouse(){
  const filtered=state.products.filter(p=>(p.name+' '+p.scientific+' '+p.category+' '+p.shelf).toLowerCase().includes((state.query||'').toLowerCase()));

function returnableItems(s){

function returnProfitReverse(s,items,refundAmount){

  finally{returnBusy=false}
}

function enableSwipeScroll(){
  document.querySelectorAll('.swipe-scroll').forEach(el=>{
    if(el.dataset.swipeBound==='1') return;
    el.dataset.swipeBound='1';
    let startX=0,startY=0,startScroll=0,dragging=false;
    el.addEventListener('touchstart',e=>{
      if(!e.touches.length)return;
      startX=e.touches[0].clientX; startY=e.touches[0].clientY; startScroll=el.scrollLeft; dragging=false;
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!e.touches.length)return;
      const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
      if(!dragging && Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)){dragging=true;}
      if(dragging){e.preventDefault(); el.scrollLeft=startScroll-dx;}
    },{passive:false});
  });
}

function go(v){if(!state.currentUser)return render();if(v==='users'&&!isManager())return toast('صفحة المستخدمين متاحة للمدير فقط');if(['warehouse','inventory','purchases','expenses','customers'].includes(v)&&!can('view'))return toast('ليس لديك صلاحية');state.view=v;state.query='';toggleSidebar(false);render()}
function cartSubtotal(){return state.cart.reduce((a,i)=>a+i.price*i.qty,0)}
function calcDiscount(){let sub=cartSubtotal(),v=Math.max(0,Number(state.discountValue||0));return Math.min(sub,state.discountType==='fixed'?v:sub*v/100)}
function updatePOSTotals(){let d=$('discountValue'),sub=cartSubtotal(),v=Number(d?.value||state.discountValue||0);state.discountValue=v;let amt=Math.min(sub,state.discountType==='fixed'?v:sub*v/100);if($('discountAmount'))$('discountAmount').textContent=money(amt);if($('posGrandTotal'))$('posGrandTotal').textContent=money(Math.max(0,sub-amt))}
async function addCart(id,unit='strip'){
  if(!canSellNow()){toast(state.currentUser?.role==='pharmacist'?'يجب بدء وردية الصيدلي أولاً قبل البيع':'ليس لديك صلاحية للبيع');return}
  let p=state.products.find(x=>x.id===id);if(!p)return;
  const strip=isStripForm(p);
  unit=strip?'strip':'unit';
  const u=unitInfo(p),unitSize=1,price=strip?u.stripPrice:u.piecePrice,unitLabel=strip?'شريط':'وحدة';
  const stock=Number(p.stockUnits!=null?p.stockUnits:p.stock||0);
  const i=state.cart.find(x=>x.id===id&&x.unit===unit);
  const used=state.cart.filter(x=>x.id===id).reduce((a,x)=>a+x.qty*x.unitSize,0);
  if(used+1>stock)return toast('تجاوزت المخزون المتاح');
  if(i)i.qty++;else state.cart.push({id:p.id,name:p.name,cost:p.cost,price,qty:1,unit,unitLabel,unitSize});
  state.query='';render();
}
function changeQty(index,d){let i=state.cart[index];if(!i)return;let p=state.products.find(x=>x.id===i.id),stock=Number(p?.stockUnits!=null?p.stockUnits:p?.stock||0);let used=state.cart.filter((x,j)=>j!==index&&x.id===i.id).reduce((a,x)=>a+x.qty*x.unitSize,0);let nq=i.qty+d;if(nq<=0)state.cart.splice(index,1);else if(used+nq*i.unitSize<=stock)i.qty=nq;else toast('تم الوصول للحد الأقصى للمخزون');render()}
function removeCart(index){state.cart.splice(index,1);render()}
function clearCart(){state.cart=[];state.discountValue=0;state.paymentMethod='cash';state.paymentProof='';render()}
function setPaymentMethod(method){
  state.paymentMethod=['bankak','fawry','ocash'].includes(method)?method:'cash';
  if(state.paymentMethod==='cash')state.paymentProof='';
  render();
  if(isElectronicPayment(state.paymentMethod)&&!state.paymentProof)setTimeout(()=>openPaymentCamera(),120);
}
async function handlePaymentProofFile(file){
  if(!file)return;
  if(!file.type.startsWith('image/'))return toast('الملف المختار ليس صورة');
  try{
    const reader=new FileReader();
    reader.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.paymentProof=c.toDataURL('image/jpeg',0.7);closePaymentCamera();render();toast('تم حفظ صورة إشعار التحويل مؤقتاً')};im.onerror=()=>toast('تعذر قراءة صورة الإشعار');im.src=reader.result};
    reader.readAsDataURL(file);
  }catch(e){toast('تعذر قراءة صورة الإشعار')}
}
let paymentStream=null,paymentFacing='environment';
async function openPaymentCamera(){
  $('modal').innerHTML=`<div class="modal-box"><div class="row" style="justify-content:space-between"><h2>📷 تصوير إشعار ${paymentMethodLabel(state.paymentMethod)}</h2><button class="btn light" onclick="closePaymentCamera()">إغلاق</button></div><div class="camera"><video id="paymentVideo" autoplay muted playsinline></video></div><p id="paymentCameraMsg" class="muted">ضع إشعار التحويل داخل الإطار ثم اضغط تصوير.</p><div class="row"><button class="btn primary" onclick="capturePaymentProof()">📸 تصوير وحفظ</button><button class="btn dark" onclick="switchPaymentCamera()">تبديل الكاميرا</button><label class="btn light">🖼️ اختيار من المعرض<input type="file" accept="image/*" onchange="handlePaymentProofFile(this.files[0])" hidden></label></div></div>`;
  $('modal').classList.add('show');
  if(!navigator.mediaDevices?.getUserMedia){$('paymentCameraMsg').textContent='الكاميرا غير متاحة. استخدم HTTPS أو اختر صورة من الهاتف.';return}
  await startPaymentCamera();
}
async function startPaymentCamera(){
  try{
    if(paymentStream)paymentStream.getTracks().forEach(t=>t.stop());
    paymentStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:paymentFacing},width:{ideal:1280},height:{ideal:1920}},audio:false});
    const v=$('paymentVideo');if(!v)return;v.srcObject=paymentStream;await v.play();
  }catch(e){const m=$('paymentCameraMsg');if(m)m.textContent='تعذر تشغيل الكاميرا. اسمح لـ Chrome باستخدام الكاميرا أو اختر صورة من الهاتف.'}
}
async function switchPaymentCamera(){paymentFacing=paymentFacing==='environment'?'user':'environment';await startPaymentCamera()}
function capturePaymentProof(){
  const v=$('paymentVideo');
  if(!v||!v.videoWidth){toast('انتظر حتى تعمل الكاميرا ثم حاول مرة أخرى');return}
  const maxW=1200,scale=Math.min(1,maxW/v.videoWidth),canvas=document.createElement('canvas');canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);const ctx=canvas.getContext('2d');ctx.drawImage(v,0,0,canvas.width,canvas.height);state.paymentProof=canvas.toDataURL('image/jpeg',0.78);closePaymentCamera();render();toast('تم تصوير إشعار التحويل')
}
function closePaymentCamera(){if(paymentStream){paymentStream.getTracks().forEach(t=>t.stop());paymentStream=null}closeModal()}

async function checkout(){
  if(!requirePerm('sale'))return;
  if(!canSellNow()){toast(state.currentUser?.role==='pharmacist'?'يجب بدء وردية الصيدلي أولاً قبل البيع':'لا يمكن إتمام البيع حالياً');return;}
  if(!state.cart.length)return toast('السلة فارغة');
  if(isElectronicPayment(state.paymentMethod)&&!state.paymentProof){toast(`يجب حفظ إشعار تحويل ${paymentMethodLabel(state.paymentMethod)} قبل إتمام البيع`);setTimeout(()=>openPaymentCamera(),150);return}
  let subtotal=cartSubtotal(),discountAmount=calcDiscount(),total=Math.max(0,subtotal-discountAmount);
  const paidEl=$('paidAmount');
  let paid=paidEl&&paidEl.value!==''?Number(paidEl.value):total;
  if(!Number.isFinite(paid)||paid<total){toast('المبلغ المدفوع يجب أن يكون أكبر من أو يساوي إجمالي الفاتورة');return}
  const change=Math.max(0,paid-total);
  let profit=state.cart.reduce((a,i)=>{let p=state.products.find(x=>x.id===i.id),unitCost=Number(p?.cost||0);return a+(i.price-unitCost)*i.qty},0)-discountAmount;
  const ash=state.currentUser?.role==='pharmacist'?activeShift():null;
  const salePharmacistName=ash?.pharmacistName||state.currentUser?.username||'';
  let s={invoice:'INV-'+Date.now().toString().slice(-8),time:new Date().toISOString(),subtotal,discountType:state.discountType||'percent',discountValue:Number(state.discountValue||0),discountAmount,total,profit,paymentMethod:state.paymentMethod||'cash',paidAmount:paid,changeAmount:change,paymentProof:isElectronicPayment(state.paymentMethod)?state.paymentProof:'',items:state.cart.map(i=>({id:i.id,name:i.name,price:i.price,cost:i.cost,qty:i.qty,unit:i.unit,unitLabel:i.unitLabel,unitSize:i.unitSize,boxStrips:unitInfo(state.products.find(x=>x.id===i.id)||{}).boxStrips})),customer:'',pharmacistId:ash?.pharmacistId||null,pharmacistName:salePharmacistName,shiftId:ash?.id||null,userId:state.currentUser?.id||null,userName:state.currentUser?.username||''};
  s.id=await add('sales',s);
  for(const i of state.cart){let p=state.products.find(x=>x.id===i.id);if(p){p.stockUnits=Math.max(0,Number(p.stockUnits!=null?p.stockUnits:p.stock||0)-i.qty*i.unitSize);p.stock=p.stockUnits;await put('products',p)}}

function exportInventoryStocktake(){
  try{
    const formOrder={tablets_capsules:1,liquid:2,topical:3,drops:4,injections:5,inhalations_aerosols:6,suppositories_pessaries:7,transdermal_patches:8,effervescent:9,powders_granules:10,implants_inserts:11,nasal_sprays:12,other:13};
    const formNames={tablets_capsules:'Tablets & Capsules',liquid:'Liquid Preparations',topical:'Topical Preparations',drops:'Drops',injections:'Injections',inhalations_aerosols:'Inhalations & Aerosols',suppositories_pessaries:'Suppositories & Pessaries',transdermal_patches:'Transdermal Patches',effervescent:'Effervescent Formulations',powders_granules:'Powders & Granules',implants_inserts:'Implants & Inserts',nasal_sprays:'Nasal Sprays & Sprays',other:'Other / غيرها'};
    const products=Array.isArray(state.products)?state.products:[];
    const rows=products.slice().sort((a,b)=>{
      const ao=formOrder[a.dosageForm]||99,bo=formOrder[b.dosageForm]||99;
      if(ao!==bo)return ao-bo;
      const ac=String(a.category||'غير مصنف').trim(),bc=String(b.category||'غير مصنف').trim();
      const c=ac.localeCompare(bc,'ar');
      return c||String(a.name||'').localeCompare(String(b.name||''),'ar');
    });
    const xmlEsc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
    const cell=(v,type)=>`<Cell><Data ss:Type="${type||'String'}">${xmlEsc(v)}</Data></Cell>`;
    const header=['الفئة','اسم الدواء','الكمية','مكان الرف'];
    const body=[];
    let lastForm='';let lastCat='';
    rows.forEach(p=>{
      const form=p.dosageForm||'other',formName=formNames[form]||'أشكال أخرى',cat=String(p.category||'غير مصنف').trim()||'غير مصنف';
      if(formName!==lastForm){
        body.push(`<Row ss:StyleID="Group"><Cell ss:MergeAcross="3"><Data ss:Type="String">${xmlEsc(formName)}</Data></Cell></Row>`);
        lastForm=formName;lastCat='';
      }
      if(form==='tablets_capsules'&&cat!==lastCat){
        body.push(`<Row ss:StyleID="Category"><Cell ss:MergeAcross="3"><Data ss:Type="String">${xmlEsc('الفئة: '+cat)}</Data></Cell></Row>`);
        lastCat=cat;
      }
      const units=Number(p.stockUnits!=null?p.stockUnits:p.stock||0);
      const qty=isStripForm(p)?`${units} شريط`:`${units} وحدة`;
      body.push('<Row>'+cell(cat)+cell(p.name||'')+cell(qty)+cell(p.shelf||'-')+'</Row>');
    });
    if(!rows.length) body.push(`<Row>${cell('لا توجد أدوية في المخزون')}</Row>`);
    const now=new Date();
    const xml=`<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
<Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center"/><Font ss:FontName="Arial" ss:Size="10"/></Style>
<Style ss:ID="Title"><Font ss:Bold="1" ss:Size="16"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>
<Style ss:ID="Header"><Font ss:Bold="1"/><Interior ss:Color="#D9EAD3" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>
<Style ss:ID="Group"><Font ss:Bold="1" ss:Size="13"/><Interior ss:Color="#DDEBF7" ss:Pattern="Solid"/></Style>
<Style ss:ID="Category"><Font ss:Bold="1"/><Interior ss:Color="#FFF2CC" ss:Pattern="Solid"/></Style>
</Styles>
<Worksheet ss:Name="الجرد"><Table>
<Column ss:Width="150"/><Column ss:Width="220"/><Column ss:Width="100"/><Column ss:Width="120"/>
<Row ss:Height="26"><Cell ss:MergeAcross="3" ss:StyleID="Title"><Data ss:Type="String">MyPharmacy - بيان الجرد</Data></Cell></Row>
<Row><Cell ss:MergeAcross="3"><Data ss:Type="String">تاريخ التصدير: ${xmlEsc(now.toLocaleString('ar'))}</Data></Cell></Row>
<Row>${header.map(h=>cell(h)).join('')}</Row>
${body.join('')}
</Table></Worksheet></Workbook>`;
    const blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'});
    const filename='MyPharmacy-جرد-'+localDateKey(new Date())+'.xls';
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);
    try{a.click()}catch(e){window.open(url,'_blank','noopener,noreferrer')}
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},3000);
    toast('تم إنشاء ملف Excel للجرد وترتيبه حسب الشكل الدوائي والفئة');
  }catch(e){console.error('stocktake export',e);toast('تعذر إنشاء ملف الجرد. حاول مرة أخرى.');}
}
